lex items-center justify-center text-primary font-label-md text-label-md rounded-xl hover:bg-surface-container transition-colors"><span class="material-symbols-outlined text-[20px] mr-1">translate</span><span class="text-xs">HI/EN</span></button></div></div></header><main class="flex-1 flex flex-col w-full max-w-[390px] mx-auto px-margin pt-16 pb-safe bg-surface"><div class="flex flex-col w-full pb-space-lg select-none flex-1">

<!-- Option 2: Hindi -->
<button aria-checked="false" class="lang-option w-full min-h-[76px] p-space-md rounded-xl bg-surface-container-lowest shadow-sm flex items-center justify-between text-left transition-all active:scale-[0.99]" data-lang="hi" onclick="selectLang(this, 'hi')" role="radio" type="button"><div class="flex items-center gap-space-md"><div class="w-12 h-12 rounded-xl bg-surface-container flex items-center justify-center text-primary font-title-md text-title-md font-bold shrink-0">अ</div><div><div class="flex items-center gap-2"><span class="font-title-md text-title-md text-on-surface font-semibold">हिन्दी</span><span class="font-label-sm text-label-sm text-on-surface-variant">(Hindi)</span></div><p class="font-label-sm text-label-sm text-on-surface-variant mt-0.5">दवाओं और सॉल्ट की पूरी जानकारी हिन्दी में</p></div></div><div class="radio-indicator w-6 h-6 rounded-full border-2 border-outline-variant flex items-center justify-center bg-surface-container-lowest shrink-0 ml-2"><div class="radio-dot w-3 h-3 rounded-full bg-primary scale-0 transition-transform"></div></div></button>

<div class="flex flex-col gap-space-sm mt-auto pt-space-xs">
<button class="w-full h-14 bg-primary text-on-primary font-body-lg-bold text-body-lg-bold rounded-xl flex items-center justify-center gap-2 shadow-md active:bg-primary-container transition-all" id="continue-btn" type="button">
<span>Continue</span>
<span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>

</div>
</div>
<script>
  function selectLang(selectedEl, lang) {
    const options = document.querySelectorAll('.lang-option');
    options.forEach(opt => {
      opt.setAttribute('aria-checked', 'false');
      opt.classList.remove('ring-2', 'ring-primary', 'bg-primary/5');
      const ind = opt.querySelector('.radio-indicator');
      const dot = opt.querySelector('.radio-dot');
      ind.classList.remove('border-primary');
      ind.classList.add('border-outline-variant');
      dot.classList.add('scale-0');
    });

    selectedEl.setAttribute('aria-checked', 'true');
    selectedEl.classList.add('ring-2', 'ring-primary', 'bg-primary/5');
    const activeInd = selectedEl.querySelector('.radio-indicator');
    const activeDot = selectedEl.querySelector('.radio-dot');
    activeInd.classList.remove('border-outline-variant');
    activeInd.classList.add('border-primary');
    activeDot.classList.remove('scale-0');

    const btn = document.getElementById('continue-btn');
    if (lang === 'hi') {
      btn.querySelector('span:first-child').innerText = 'आगे बढ़ें';
    } else if (lang === 'bn') {
      btn.querySelector('span:first-child').innerText = 'এগিয়ে যান';
    } else {
      btn.querySelector('span:first-child').innerText = 'Continue';
    }
  }
</script></main>
