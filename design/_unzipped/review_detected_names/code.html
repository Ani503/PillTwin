<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"><meta content="mobile_stack" name="shell-type"><title>PillTwin</title><link href="https://fonts.googleapis.com" rel="preconnect"><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { colors: { "inverse-surface": "#30312f", "error-container": "#ffdad6", "surface": "#fbf9f6", "background": "#fbf9f6", "surface-container-high": "#eae8e5", "surface-dim": "#dbdad7", "tertiary-fixed": "#95f8a7", "secondary": "#99462b", "secondary-fixed-dim": "#ffb59e", "on-primary-container": "#a3faef", "primary": "#005c55", "on-secondary-fixed-variant": "#7a2f16", "tertiary-container": "#087a38", "on-surface": "#1b1c1a", "surface-variant": "#e4e2df", "on-tertiary-fixed-variant": "#005323", "surface-bright": "#fbf9f6", "on-tertiary-container": "#a3ffb2", "on-secondary-fixed": "#3a0a00", "on-background": "#1b1c1a", "on-primary": "#ffffff", "on-surface-variant": "#3e4947", "surface-container-highest": "#e4e2df", "on-secondary": "#ffffff", "on-primary-fixed-variant": "#00504a", "error": "#ba1a1a", "primary-container": "#0f766e", "on-tertiary-fixed": "#00210a", "surface-container-lowest": "#ffffff", "outline-variant": "#bdc9c6", "surface-container-low": "#f5f3f0", "on-error-container": "#93000a", "surface-tint": "#006a63", "primary-fixed-dim": "#80d5cb", "secondary-fixed": "#ffdbd0", "on-primary-fixed": "#00201d", "tertiary-fixed-dim": "#79db8d", "outline": "#6e7977", "secondary-container": "#fe9574", "on-secondary-container": "#762c13", "surface-container": "#efeeeb", "inverse-on-surface": "#f2f0ed", "primary-fixed": "#9cf2e8", "on-tertiary": "#ffffff", "on-error": "#ffffff", "tertiary": "#005f29", "inverse-primary": "#80d5cb" }, borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, spacing: { "margin": "1rem", "space-lg": "1.5rem", "space-xs": "0.5rem", "space-md": "1rem", "space-xl": "2rem", "gutter": "1rem", "space-sm": "0.75rem" }, fontFamily: { "label-md": ["Inter"], "title-md": ["Inter"], "body-lg-bold": ["Inter"], "headline-lg": ["Inter"], "label-sm": ["Inter"], "body-lg": ["Inter"], "headline-lg-mobile": ["Inter"] }, fontSize: { "label-md": ["14px", { lineHeight: "20px", letterSpacing: "0.01em", fontWeight: "600" }], "title-md": ["20px", { lineHeight: "28px", letterSpacing: "-0.01em", fontWeight: "600" }], "body-lg-bold": ["16px", { lineHeight: "24px", letterSpacing: "0em", fontWeight: "600" }], "headline-lg": ["34px", { lineHeight: "42px", letterSpacing: "-0.02em", fontWeight: "700" }], "label-sm": ["14px", { lineHeight: "20px", letterSpacing: "0.01em", fontWeight: "500" }], "body-lg": ["16px", { lineHeight: "24px", letterSpacing: "0em", fontWeight: "400" }], "headline-lg-mobile": ["32px", { lineHeight: "40px", letterSpacing: "-0.02em", fontWeight: "700" }] } } } };</script><style>@layer base{html,body{width:100%;margin:0;padding:0;min-height:100%;background-color:#fbf9f6;color:#1b1c1a;}body{overscroll-behavior-y:none;-webkit-tap-highlight-color:transparent;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style></head><body class="bg-surface font-body-lg text-body-lg text-on-surface flex flex-col min-h-screen antialiased"><header class="fixed top-0 inset-x-0 z-50 bg-surface/85 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.03)] pt-safe"><div class="h-16 px-margin flex items-center justify-between"><div class="flex items-center gap-space-xs"><button aria-label="Go Back" class="w-12 h-12 flex items-center justify-center text-on-surface rounded-full hover:bg-surface-container active:scale-95 transition-all" onclick="history.back()"><span class="material-symbols-outlined text-[24px]">arrow_back</span></button><h1 class="font-title-md text-title-md font-semibold text-on-surface tracking-tight truncate max-w-[170px]">Review</h1></div><div class="flex items-center gap-space-xs"><button aria-label="Change Language" class="min-h-[44px] min-w-[44px] px-space-xs flex items-center justify-center text-primary font-label-md text-label-md rounded-xl hover:bg-surface-container transition-colors"><span class="material-symbols-outlined text-[20px] mr-1">translate</span><span class="text-xs">HI/EN</span></button></div></div></header><main class="flex-1 flex flex-col w-full max-w-[390px] mx-auto px-margin pt-16 pb-safe bg-surface"><div class="flex flex-col w-full pb-32">
<!-- Friendly Progress & Verification Header -->
<section class="mt-4 mb-6">

<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-2">
      Is this right?
    </h2>
<p class="font-body-lg text-body-lg text-on-surface-variant">
      Check the medicine names we read from your photo.
    </p>
</section>
<!-- Extracted Prescription Preview Thumbnail -->

<!-- Detected Items List -->
<div class="flex flex-col gap-3 mb-5" id="medicine-list">
<!-- Item 1 (Success) -->
<div class="bg-surface-container-lowest rounded-xl p-4 shadow-sm transition-all duration-200" id="item-brandex"><div class="flex items-start justify-between gap-3"><div class="flex items-start gap-3"><div class="w-10 h-10 rounded-xl bg-surface-container flex items-center justify-center text-primary flex-shrink-0 mt-0.5"><span class="material-symbols-outlined text-[22px]">medication</span></div><div><div class="flex items-center gap-2"><span class="font-body-lg-bold text-body-lg-bold text-on-surface">Brandex 500 tablet</span></div></div></div></div><div class="flex items-center justify-end gap-2 mt-4 pt-3 bg-surface-container-low/40 -mx-4 -mb-4 px-4 py-2.5 rounded-b-xl"><button aria-label="Edit Brandex 500 tablet" class="min-h-[44px] px-3 py-1.5 rounded-lg flex items-center gap-1.5 text-on-surface-variant hover:bg-surface-container active:scale-95 transition-all text-sm font-label-md" onclick="openEditModal('Brandex 500 tablet')" type="button"><span class="material-symbols-outlined text-[18px]">edit</span><span>Edit</span></button><button aria-label="Remove Brandex 500 tablet" class="min-h-[44px] px-3 py-1.5 rounded-lg flex items-center gap-1.5 text-on-surface-variant hover:bg-surface-container active:scale-95 transition-all text-sm font-label-md" onclick="removeItem('item-brandex')" type="button"><span class="material-symbols-outlined text-[18px]">delete</span><span>Remove</span></button></div></div>
<!-- Item 2 (Success) -->
<div class="bg-surface-container-lowest rounded-xl p-4 shadow-sm transition-all duration-200" id="item-cardiofix">
<div class="flex items-start justify-between gap-3">
<div class="flex items-start gap-3">
<div class="w-10 h-10 rounded-xl bg-surface-container flex items-center justify-center text-primary flex-shrink-0 mt-0.5">
<span class="material-symbols-outlined text-[22px]">cardiology</span>
</div>
<div><div class="flex items-center gap-2"><span class="font-body-lg-bold text-body-lg-bold text-on-surface">Cardiofix 5</span></div></div>
</div>
</div>
<!-- Card Action Seam -->
<div class="flex items-center justify-end gap-2 mt-4 pt-3 bg-surface-container-low/40 -mx-4 -mb-4 px-4 py-2.5 rounded-b-xl">
<button aria-label="Edit Cardiofix 5" class="min-h-[44px] px-3 py-1.5 rounded-lg flex items-center gap-1.5 text-on-surface-variant hover:bg-surface-container active:scale-95 transition-all text-sm font-label-md" onclick="openEditModal('Cardiofix 5')" type="button">
<span class="material-symbols-outlined text-[18px]">edit</span>
<span>Edit</span>
</button>
<button aria-label="Remove Cardiofix 5" class="min-h-[44px] px-3 py-1.5 rounded-lg flex items-center gap-1.5 text-on-surface-variant hover:bg-surface-container active:scale-95 transition-all text-sm font-label-md" onclick="removeItem('item-cardiofix')" type="button">
<span class="material-symbols-outlined text-[18px]">delete</span>
<span>Remove</span>
</button>
</div>
</div>
<!-- Item 3 (Amber Warning State) -->
<div class="bg-secondary-fixed/50 rounded-xl p-4 shadow-sm transition-all duration-200" id="item-warning"><div class="flex items-start gap-3"><div class="w-10 h-10 rounded-xl bg-secondary-container/40 flex items-center justify-center text-on-secondary-fixed-variant flex-shrink-0"><span class="material-symbols-outlined text-[22px]">help_center</span></div><div class="flex-1"><div class="font-body-lg-bold text-body-lg-bold text-on-secondary-fixed mb-1">Couldn't read this. Please type the name.</div><div class="flex items-center justify-between gap-3 mt-3"><button class="min-h-[44px] px-4 py-2 bg-on-secondary-fixed text-surface rounded-xl font-label-md text-label-md flex items-center gap-2 shadow-sm active:scale-95 transition-all" onclick="openManualInput()" type="button"><span class="material-symbols-outlined text-[18px]">keyboard</span><span>Type name</span></button><button class="min-h-[44px] px-3 py-2 text-on-secondary-fixed-variant hover:bg-secondary-fixed font-label-sm text-label-sm rounded-xl transition-colors" onclick="removeItem('item-warning')" type="button">Skip</button></div></div></div></div>
</div>
<!-- Manual Add Medicine Button -->
<button class="w-full h-[52px] rounded-xl bg-surface-container flex items-center justify-center gap-2 text-primary font-label-md text-label-md hover:bg-surface-container-high active:scale-[0.99] transition-all mb-8 shadow-sm" onclick="openManualInput()" type="button">
<span class="material-symbols-outlined text-[20px]">add_circle</span>
<span>+ Add another medicine</span>
</button>
<!-- Reassurance & Privacy Utility Card -->

<!-- Micro-Delight Tip Box -->

<!-- Fixed Bottom Floating CTA Bar -->
<div class="fixed bottom-0 inset-x-0 bg-surface/95 backdrop-blur-md pt-3 pb-safe px-margin z-40 shadow-[0px_-4px_20px_rgba(26,26,26,0.06)]">
<div class="max-w-[390px] mx-auto pb-3">
<button class="w-full h-14 bg-primary text-on-primary rounded-xl font-body-lg-bold text-body-lg-bold flex items-center justify-center gap-2 hover:bg-primary-container active:scale-[0.98] transition-all shadow-md group" id="find-generics-btn" onclick="proceedToGenerics()" type="button">
<span>Find generics</span>
<span class="material-symbols-outlined text-[22px] group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>

</div>
</div>
<!-- Interactive Modal / Slide-up Overlay for Editing / Typing -->
<div class="fixed inset-0 z-50 bg-inverse-surface/40 backdrop-blur-sm hidden items-end sm:items-center justify-center p-0 sm:p-4" id="medicine-modal">
<div class="w-full max-w-[390px] bg-surface rounded-t-2xl sm:rounded-2xl p-5 shadow-xl transition-transform animate-in slide-in-from-bottom duration-200">
<div class="flex items-center justify-between mb-4">
<h3 class="font-title-md text-title-md text-on-surface" id="modal-title">Edit Medicine</h3>
<button aria-label="Close dialog" class="w-10 h-10 rounded-full flex items-center justify-center text-on-surface-variant hover:bg-surface-container" onclick="closeModal()" type="button">
<span class="material-symbols-outlined text-[22px]">close</span>
</button>
</div>
<div class="mb-4">
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-2" for="medicine-name-input">Medicine name or Active salt</label>
<div class="bg-surface-container-lowest rounded-xl flex items-center px-4 h-14 shadow-sm focus-within:ring-2 focus-within:ring-primary">
<span class="material-symbols-outlined text-outline text-[20px] mr-2">search</span>
<input class="bg-transparent w-full text-on-surface font-body-lg text-body-lg focus:outline-none" id="medicine-name-input" placeholder="e.g. Paracetamol 500mg, Metformin" type="text">
</div>
</div>
<div class="flex gap-2 mb-4">
<button class="px-3 py-1.5 bg-surface-container rounded-full text-xs font-label-md text-on-surface hover:bg-surface-container-high transition-colors" onclick="fillSuggestion('Metformin 500mg')" type="button">
          + Metformin 500mg
        </button>
<button class="px-3 py-1.5 bg-surface-container rounded-full text-xs font-label-md text-on-surface hover:bg-surface-container-high transition-colors" onclick="fillSuggestion('Pantoprazole 40mg')" type="button">
          + Pantoprazole
        </button>
</div>
<div class="flex items-center gap-3">
<button class="flex-1 h-12 bg-surface-container-low text-on-surface rounded-xl font-label-md text-label-md hover:bg-surface-container transition-colors" onclick="closeModal()" type="button">
          Cancel
        </button>
<button class="flex-1 h-12 bg-primary text-on-primary rounded-xl font-label-md text-label-md hover:bg-primary-container shadow-sm transition-colors" onclick="saveModalValue()" type="button">
          Save Medicine
        </button>
</div>
</div>
</div>
</div>
<script>
  let currentTargetItem = null;

  function removeItem(elementId) {
    const el = document.getElementById(elementId);
    if (el) {
      el.style.opacity = '0';
      el.style.transform = 'scale(0.95)';
      setTimeout(() => {
        el.remove();
        checkEmptyState();
      }, 200);
    }
  }

  function openEditModal(existingName) {
    currentTargetItem = existingName;
    document.getElementById('modal-title').textContent = 'Edit Medicine Name';
    document.getElementById('medicine-name-input').value = existingName;
    const modal = document.getElementById('medicine-modal');
    modal.classList.remove('hidden');
    modal.classList.add('flex');
    document.getElementById('medicine-name-input').focus();
  }

  function openManualInput() {
    currentTargetItem = null;
    document.getElementById('modal-title').textContent = 'Add Medicine';
    document.getElementById('medicine-name-input').value = '';
    const modal = document.getElementById('medicine-modal');
    modal.classList.remove('hidden');
    modal.classList.add('flex');
    document.getElementById('medicine-name-input').focus();
  }

  function fillSuggestion(text) {
    document.getElementById('medicine-name-input').value = text;
  }

  function closeModal() {
    const modal = document.getElementById('medicine-modal');
    modal.classList.add('hidden');
    modal.classList.remove('flex');
  }

  function saveModalValue() {
    const val = document.getElementById('medicine-name-input').value.trim();
    if (!val) return;

    if (currentTargetItem) {
      // If editing existing item, update in-place or add
      const list = document.getElementById('medicine-list');
      const newCard = createMedicineCard(val);
      list.prepend(newCard);
    } else {
      // Manual add or typing unknown line
      const list = document.getElementById('medicine-list');
      const warningItem = document.getElementById('item-warning');
      if (warningItem) {
        warningItem.remove();
      }
      const newCard = createMedicineCard(val);
      list.appendChild(newCard);
    }
    closeModal();
  }

  function createMedicineCard(name) {
    const id = 'custom-' + Date.now();
    const div = document.createElement('div');
    div.id = id;
    div.className = 'bg-surface-container-lowest rounded-xl p-4 shadow-sm transition-all duration-200 animate-in fade-in';
    div.innerHTML = `
      <div class="flex items-start justify-between gap-3">
        <div class="flex items-start gap-3">
          <div class="w-10 h-10 rounded-xl bg-surface-container flex items-center justify-center text-primary flex-shrink-0 mt-0.5">
            <span class="material-symbols-outlined text-[22px]">medication</span>
          </div>
          <div>
            <div class="flex items-center gap-2 mb-1 flex-wrap">
              <span class="font-body-lg-bold text-body-lg-bold text-on-surface">${escapeHtml(name)}</span>
              <span class="px-2 py-0.5 bg-surface-container-high text-on-surface-variant rounded-full text-xs font-label-sm">sample</span>
            </div>
            <div class="flex items-center gap-1.5 text-tertiary">
              <span class="material-symbols-outlined text-[16px]">verified</span>
              <span class="font-label-sm text-label-sm">Active formula confirmed</span>
            </div>
          </div>
        </div>
      </div>
      <div class="flex items-center justify-end gap-2 mt-4 pt-3 bg-surface-container-low/40 -mx-4 -mb-4 px-4 py-2.5 rounded-b-xl">
        <button type="button" onclick="openEditModal('${escapeHtml(name)}')" class="min-h-[44px] px-3 py-1.5 rounded-lg flex items-center gap-1.5 text-on-surface-variant hover:bg-surface-container text-sm font-label-md">
          <span class="material-symbols-outlined text-[18px]">edit</span>
          <span>Edit</span>
        </button>
        <button type="button" onclick="removeItem('${id}')" class="min-h-[44px] px-3 py-1.5 rounded-lg flex items-center gap-1.5 text-secondary hover:bg-error-container/30 text-sm font-label-md">
          <span class="material-symbols-outlined text-[18px]">delete</span>
          <span>Remove</span>
        </button>
      </div>
    `;
    return div;
  }

  function escapeHtml(str) {
    return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function checkEmptyState() {
    const list = document.getElementById('medicine-list');
    if (!list.children.length) {
      list.innerHTML = `
        <div class="bg-surface-container rounded-xl p-6 text-center">
          <span class="material-symbols-outlined text-outline text-[40px] mb-2">content_paste_off</span>
          <p class="font-body-lg-bold text-body-lg-bold text-on-surface mb-1">No medicines listed</p>
          <p class="font-label-sm text-label-sm text-on-surface-variant mb-4">Please type a name to find high-potency fair price alternatives.</p>
          <button type="button" onclick="openManualInput()" class="px-4 py-2 bg-primary text-on-primary rounded-xl font-label-md text-label-md">
            + Add Medicine
          </button>
        </div>
      `;
    }
  }

  function proceedToGenerics() {
    const btn = document.getElementById('find-generics-btn');
    btn.innerHTML = `
      <span class="material-symbols-outlined animate-spin text-[20px]">progress_activity</span>
      <span>Finding fair price salts...</span>
    `;
    setTimeout(() => {
      // Mock navigation transition feedback
      btn.innerHTML = `
        <span class="material-symbols-outlined text-[22px]">check</span>
        <span>Generics Found!</span>
      `;
    }, 800);
  }
</script></main>

</body></html>
